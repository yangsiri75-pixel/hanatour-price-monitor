name: hanatour-price-monitor

on:
  schedule:
    # UTC 기준. 00:00 UTC = 한국 09:00, 09:00 UTC = 한국 18:00
    - cron: "0 0 * * *"
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      force_notify:
        description: "변동 없어도 메일 강제 발송 (테스트)"
        required: false
        default: "0"

permissions:
  contents: write

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -r requirements.txt

      - name: Run monitor
        id: run
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          FORCE_NOTIFY: ${{ github.event.inputs.force_notify || '0' }}
        run: python monitor.py

      - name: Commit data
        run: |
          git config user.name "price-monitor-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && echo "no data change" || git commit -m "data: $(date -u +'%Y-%m-%d %H:%M') UTC (alert=${{ steps.run.outputs.has_alert }})"
          git push

      - name: Summary
        run: |
          echo "### 실행 결과" >> $GITHUB_STEP_SUMMARY
          cat data/changes.json >> $GITHUB_STEP_SUMMARY
